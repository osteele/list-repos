name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JJ_VERSION: v0.44.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install jj (Jujutsu)
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-*)  asset=jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz ;;
            macos-*)   asset=jj-${JJ_VERSION}-aarch64-apple-darwin.tar.gz ;;
            windows-*) asset=jj-${JJ_VERSION}-x86_64-pc-windows-msvc.zip ;;
          esac
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/${asset}" -o jj-archive
          mkdir jj-extract
          case "${{ matrix.os }}" in
            windows-*) pwsh -NoProfile -Command "Expand-Archive -Path jj-archive -DestinationPath jj-extract" ;;
            *)         tar -xf jj-archive -C jj-extract ;;
          esac
          jjbin=$(find jj-extract -type f \( -name jj -o -name jj.exe \) | head -n 1)
          "$jjbin" --version
          bindir=$(cd "$(dirname "$jjbin")" && pwd)
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # GITHUB_PATH needs a Windows-native path, not git-bash's POSIX form
            bindir=$(cd "$(dirname "$jjbin")" && pwd -W)
          fi
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Run tests
        run: go test ./...
